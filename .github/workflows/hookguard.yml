name: hookguard

# Checks the hook for a handful of known Uniswap v4 footguns on every change.
# Heuristic pattern matching, not an audit. Set to annotate only, never block.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write   # allows one summary comment per PR

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chaosxcode/hookguard@v1
        with:
          paths: src
          fail-on: never
